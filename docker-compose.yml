services:
  postgres:
    image: postgres:16-alpine
    container_name: homefix-postgres
    environment:
      POSTGRES_DB: homefix
      POSTGRES_USER: homefix
      POSTGRES_PASSWORD: homefix123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefix -d homefix"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: homefix-backend
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://homefix:homefix123@postgres:5432/homefix
      JWT_SECRET: homefix-development-secret
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: homefix-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: